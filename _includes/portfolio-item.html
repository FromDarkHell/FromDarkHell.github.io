<div
  class="min-w-[280px] max-w-[280px] snap-start border border-green-500/30 bg-black/60 rounded-lg hover:border-green-400 transition hover:shadow-[0_0_25px_rgba(34,197,94,0.25)]"
>
  {% if include.item.image %}
  <img
    src="{{ include.item.image }}"
    class="h-40 w-full object-cover opacity-90 rounded-t-lg"
  />
  {% endif %}

  <div class="p-4 space-y-2">
    <h3 class="text-green-400 font-mono text-lg">{{ include.item.title }}</h3>

    {% if include.item.tech %}
    <div class="pt-2 text-sm flex flex-wrap gap-2">
      {% for tech in include.item.tech %}
      <span
        class="bg-green-500/10 text-green-400 px-2 py-1 rounded-full border border-green-500/30"
        >{{ tech }}</span
      >
      {% endfor %}
    </div>
    {% endif %}

    <p class="text-sm text-green-200/80">{{ include.item.description }}</p>

    {% if include.item.links %}
    <div class="pt-2 text-sm">
      {% if include.item.links.site %}
      <a
        href="{{ include.item.links.site }}"
        class="text-green-400 hover:underline"
      >
        View
      </a>
      {% endif %}
    </div>
    {% endif %}
  </div>
</div>
